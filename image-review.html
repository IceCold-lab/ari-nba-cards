<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ari NBA Cards — Image Review</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#151922;--panel2:#1d2330;--text:#f3f5f8;--muted:#9aa4b2;--accent:#4d8dff;--good:#35c98b;--maybe:#f2c14e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:#0b0d12ee;backdrop-filter:blur(10px);border-bottom:1px solid #272d39;padding:12px}
h1{font-size:20px;margin:0 0 8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button,select,input{background:var(--panel2);color:var(--text);border:1px solid #394150;border-radius:8px;padding:8px 10px;font:inherit}button{cursor:pointer}.primary{background:var(--accent);border-color:var(--accent)}
main{max-width:1400px;margin:auto;padding:16px}.status{color:var(--muted);margin:8px 0}.progress{height:5px;background:#242a35;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:var(--good);width:0}
.player{background:var(--panel);border:1px solid #2a313d;border-radius:12px;margin-bottom:18px;padding:12px}.playerhead{display:flex;justify-content:space-between;margin-bottom:10px}.name{font-size:19px;font-weight:700}.meta{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{background:#10141c;border:2px solid #2a313d;border-radius:10px;overflow:hidden}.card.approved{border-color:var(--good)}.photo{height:300px;background:#080a0e;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:9px}.title{font-size:12px;font-weight:650;line-height:1.25;margin-bottom:5px}.dims{font-size:11px;color:var(--muted);margin-bottom:7px}.actions{display:flex;gap:5px}.actions button{flex:1;padding:7px 5px;font-size:12px}.keep{background:#123c2c;border-color:#247d59}.maybe{background:#473b18;border-color:#8f7428}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:600px){.photo{height:260px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.playerhead{flex-direction:column;gap:5px}}
</style></head><body>
<header><h1>Ari NBA Cards — Image Review</h1>
<div class="toolbar"><button id="load" class="primary">Load players</button><button id="export">Export approvals</button><button id="clear">Clear decisions</button>
<select id="filter"><option value="all">All players</option><option value="unreviewed">Unreviewed</option><option value="approved">Approved</option><option value="maybe">Maybe</option></select>
<select id="cat"><option value="all">All categories</option><option>Current Players</option><option>Classic Players</option></option></select>
<input id="search" placeholder="Search player…"></div>
<div class="status" id="status">Load players.json to begin.</div><div class="progress"><i id="bar"></i></div></header>
<main id="app"></main>
<script>
const API='https://commons.wikimedia.org/w/api.php';let players=[],decisions=JSON.parse(localStorage.getItem('ariImageReview')||'{}');
const $=id=>document.getElementById(id),slug=p=>p.id||p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function commonsSearch(name){let q=encodeURIComponent('"'+name+'" basketball');let u=`${API}?action=query&generator=search&gsrsearch=${q}&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|size|mime|extmetadata&iiurlwidth=600&format=json&origin=*`;let r=await fetch(u);if(!r.ok)throw Error('Commons search failed');let j=await r.json();return Object.values(j.query?.pages||{}).filter(x=>{let i=x.imageinfo?.[0];return i&&/^image\/(jpeg|png|webp)$/i.test(i.mime||'')&&(i.width||0)>=600&&(i.height||0)>=600}).map(x=>{let i=x.imageinfo[0],m=i.extmetadata||{};return{title:x.title,url:i.thumburl||i.url,original:i.url,width:i.width,height:i.height,page:i.descriptionurl||'https://commons.wikimedia.org',artist:(m.Artist?.value||'').replace(/<[^>]*>/g,''),license:(m.LicenseShortName?.value||'').replace(/<[^>]*>/g,'')}})}
function save(){localStorage.setItem('ariImageReview',JSON.stringify(decisions));updateProgress()}
function updateProgress(){let n=players.length,d=players.filter(p=>decisions[slug(p)]?.choice==='approved').length;$('bar').style.width=n?d/n*100+'%':'0%';$('status').textContent=`${n} players loaded · ${d} approved · ${Object.values(decisions).filter(x=>x.choice==='maybe').length} marked maybe`;}
async function load(){try{let r=await fetch('players.json',{cache:'no-store'});if(!r.ok)throw Error('players.json not found');players=await r.json();render(true)}catch(e){$('status').textContent=e.message+' — open this page from GitHub Pages, not file://.'}}
async function render(search){let f=$('filter').value,c=$('cat').value,t=$('search').value.trim().toLowerCase();let list=players.filter(p=>{let d=decisions[slug(p)]||{};return !(c!='all'&&p.category!==c)&&!(t&&!p.name.toLowerCase().includes(t))&&!(f==='unreviewed'&&d.choice)&&!(f==='approved'&&d.choice!=='approved')&&!(f==='maybe'&&d.choice!=='maybe')});$('app').innerHTML=list.length?list.map(p=>`<section class="player"><div class="playerhead"><div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.category||'')} · rank ${esc(p.rank??'')} · ${esc(p.status||'')}</div></div><div class="meta">${decisions[slug(p)]?.choice||'Not reviewed'}</div></div><div class="grid" id="g-${esc(slug(p))}"><div class="empty">Searching Commons…</div></div></section>`).join(''):'<div class="empty">No players match.</div>';updateProgress();for(let p of list){let g=$('g-'+slug(p));try{let cs=search?(await commonsSearch(p.name)):(decisions[slug(p)]?.candidates||[]);decisions[slug(p)]={...(decisions[slug(p)]||{}),candidates:cs};draw(p,cs,g)}catch(e){g.innerHTML='<div class="empty">Could not search Commons.</div>'}}save();}
function draw(p,cs,g){if(!cs.length){g.innerHTML='<div class="empty">No candidates found.</div>';return}g.innerHTML=cs.map((x,i)=>`<article class="card ${decisions[slug(p)]?.choice==='approved'&&decisions[slug(p)]?.candidate===i?'approved':''}"><div class="photo"><img loading="lazy" src="${esc(x.url)}" alt="${esc(p.name)}"></div><div class="info"><div class="title">${esc(x.title.replace(/^File:/,''))}</div><div class="dims">${x.width}×${x.height} · ${esc(x.license||'license unknown')}</div><div class="actions"><button class="keep" onclick="approve('${slug(p)}',${i})">KEEP</button><button class="maybe" onclick="maybe('${slug(p)}',${i})">MAYBE</button><a href="${esc(x.page)}" target="_blank"><button>OPEN</button></a></div></div></article>`).join('')}
window.approve=(id,i)=>{decisions[id]={...decisions[id],choice:'approved',candidate:i};save();render(false)};window.maybe=(id,i)=>{decisions[id]={...decisions[id],choice:'maybe',candidate:i};save();render(false)};
$('load').onclick=()=>render(true);$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(players.map(p=>{let d=decisions[slug(p)]||{},c=d.candidates?.[d.candidate];return d.choice==='approved'&&c?{id:slug(p),name:p.name,source:c}:null}).filter(Boolean),null,2)],{type:'application/json'}));a.download='image-approvals.json';a.click()};
$('clear').onclick=()=>{if(confirm('Clear all decisions?')){decisions={};localStorage.removeItem('ariImageReview');render(true)}};['filter','cat'].forEach(id=>$(id).onchange=()=>render(false));$('search').oninput=()=>render(false);
</script></body></html>
