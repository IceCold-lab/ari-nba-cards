<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ari NBA Cards — Image Review</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#151922;--panel2:#1d2330;--panel3:#10141c;--text:#f3f5f8;--muted:#9aa4b2;--line:#303846;--accent:#4d8dff;--good:#35c98b;--maybe:#e7b94f;--bad:#e46b6b;--shadow:0 8px 30px #0006}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit}button,select,input{background:var(--panel2);color:var(--text);border:1px solid #3a4352;border-radius:9px;padding:9px 11px}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);border-color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:#0b0d12ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px max(12px,env(safe-area-inset-left)) 10px max(12px,env(safe-area-inset-right))}
.headrow{max-width:1500px;margin:auto}.titleline{display:flex;align-items:center;justify-content:space-between;gap:10px}.titleline h1{font-size:19px;margin:0}.status{color:var(--muted);font-size:13px;margin:7px 0}.progress{height:5px;background:#252c37;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--good);transition:width .25s}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.toolbar>*{min-height:40px}.toolbar input{min-width:170px;flex:1}.batch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}.batch strong{font-size:13px}.batch .nav{display:flex;gap:7px}
main{max-width:1500px;margin:auto;padding:14px}.notice{background:#172033;border:1px solid #344866;border-radius:10px;padding:10px 12px;margin-bottom:14px;color:#dbe7ff}.notice.error{border-color:#6d3535;background:#241617}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:var(--muted)}
.player{background:var(--panel);border:1px solid #2a313d;border-radius:13px;margin-bottom:16px;padding:12px;box-shadow:var(--shadow)}.playerhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.name{font-size:19px;font-weight:750}.meta{color:var(--muted);font-size:12px;line-height:1.45}.state{white-space:nowrap;border-radius:999px;padding:5px 9px;font-size:11px;border:1px solid var(--line)}.state.approved{color:#8af0c4;border-color:#286e51;background:#123022}.state.maybe{color:#f4d783;border-color:#6c5924;background:#302812}.state.better{color:#ffaaaa;border-color:#6b3737;background:#321b1b}
.current{display:flex;gap:12px;align-items:center;background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:11px}.current img{width:72px;height:90px;object-fit:cover;border-radius:7px;background:#080a0e}.current .small{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:var(--panel3);border:2px solid #2a313d;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}.card.keep{border-color:var(--good)}.card.maybe{border-color:var(--maybe)}.card.reject{opacity:.55}.photo{height:300px;background:#080a0e;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photo .badge{position:absolute;top:7px;left:7px;background:#000b;border:1px solid #ffffff33;border-radius:999px;padding:4px 7px;font-size:10px}.info{padding:9px}.title{font-size:12px;font-weight:650;line-height:1.3;margin-bottom:5px;word-break:break-word}.dims{font-size:11px;color:var(--muted);margin-bottom:5px}.lic{font-size:10px;color:#c3cad4;line-height:1.35;min-height:27px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}.actions button{padding:8px 4px;font-size:11px}.keepbtn{background:#123c2c;border-color:#247d59}.maybebtn{background:#473b18;border-color:#8f7428}.rejectbtn{background:#351c1c;border-color:#713939}.editor{margin-top:8px;padding:8px;background:#0c1017;border:1px solid var(--line);border-radius:9px}.editor-preview{height:260px;background:#05070a;border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center}.editor-preview img{width:100%;height:100%;object-fit:cover;transform-origin:center;will-change:transform;display:block}.editor-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.editor-controls label{font-size:10px;color:var(--muted);display:block}.editor-controls input.crop-number{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:7px;border:1px solid #3a4350;border-radius:6px;background:#111722;color:inherit;font:inherit}.crop-help{display:block;font-size:9px;line-height:1.25;margin-top:3px;opacity:.7}.editor-actions{display:flex;gap:6px;margin-top:7px}.editor-actions button{flex:1;font-size:11px}.crop-note{font-size:10px;color:var(--muted);margin-top:6px}.openlink{display:block;text-decoration:none;color:inherit}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;grid-column:1/-1}.player-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.player-actions button{font-size:12px}.searching{animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.45}}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo{height:260px}}
@media(max-width:460px){main{padding:9px}.grid{grid-template-columns:1fr 1fr;gap:7px}.photo{height:220px}.player{padding:9px}.name{font-size:17px}.actions button{font-size:10px;padding:9px 2px}.toolbar button{flex:1}.titleline h1{font-size:17px}}
</style>
</head>
<body>
<header>
<div class="headrow">
 <div class="titleline"><h1>Ari NBA Cards — Image Review</h1><button id="help">?</button></div>
 <div class="status" id="status">Loading player data…</div>
 <div class="progress"><i id="bar"></i></div>
 <div class="toolbar">
  <button id="refresh" class="primary">Load / Refresh</button>
  <button id="export">Export</button>
  <button id="importBtn">Import</button><input id="importFile" type="file" accept="application/json" hidden>
  <button id="clear">Clear decisions</button>
  <select id="reviewFilter"><option value="all">All review states</option><option value="unreviewed">Not reviewed</option><option value="approved">Approved</option><option value="maybe">Maybe</option><option value="better">Needs better image</option></select>
  <select id="category"><option value="all">All categories</option><option>Current Players</option><option>Classic Players</option></select>
  <input id="search" placeholder="Find a player…" autocomplete="off">
 </div>
 <div class="batch"><strong id="batchLabel">Batch —</strong><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div></div>
</div>
</header>
<main id="app"></main>
<script>
'use strict';
const API='https://commons.wikimedia.org/w/api.php';
const RAW_PLAYERS='https://raw.githubusercontent.com/IceCold-lab/ari-nba-cards/main/players.json';
const RAW_MANIFEST='https://raw.githubusercontent.com/IceCold-lab/ari-nba-cards/main/image-manifest.json';
const STORAGE='ariImageReviewV2';
const BATCH_SIZE=20;
const MIN_SIDE=600;
const MAX_RESULTS=7;
const REQUEST_DELAY=1200;
let players=[];let manifest={};let decisions={};let batchStart=0;let busy=false;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
const idOf=p=>p.id||p.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');
function loadDecisions(){try{decisions=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch{decisions={}}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(decisions));updateStats()}
function stateFor(p){return decisions[idOf(p)]?.state||'unreviewed'}
function updateStats(){const n=players.length;const vals=players.map(p=>stateFor(p));const a=vals.filter(x=>x==='approved').length,m=vals.filter(x=>x==='maybe').length,b=vals.filter(x=>x==='better').length;$('bar').style.width=n?Math.round(a/n*100)+'%':'0%';$('status').textContent=`${n} players · ${a} approved · ${m} maybe · ${b} need better images · ${n-a-m-b} not reviewed`}
async function fetchJson(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()}
async function loadData(){
 $('status').textContent='Loading players.json…';
 try{players=await fetchJson('players.json')}catch(e){try{players=await fetchJson(RAW_PLAYERS)}catch(e2){showFatal(`Could not load players.json. ${e2.message}`);return}}
 try{const m=await fetchJson('image-manifest.json');manifest=manifestMap(m)}catch{try{const m=await fetchJson(RAW_MANIFEST);manifest=manifestMap(m)}catch{manifest={}}}
 loadDecisions();batchStart=0;renderBatch();updateStats();
}
function manifestMap(m){const out={};for(const x of (m.players||[])){if(x.id)out[x.id]=x}return out}
function showFatal(msg){$('app').innerHTML=`<div class="notice error"><strong>Couldn't start.</strong><br>${esc(msg)}<br><br>Open this page from GitHub Pages, not from a <code>file://</code> URL.</div>`;$('status').textContent='Startup failed'}
function filteredPlayers(){const q=$('search').value.trim().toLowerCase();const cat=$('category').value;const rf=$('reviewFilter').value;return players.filter(p=>{const s=stateFor(p);return (!q||p.name.toLowerCase().includes(q))&&(cat==='all'||p.category===cat)&&(rf==='all'||(rf==='unreviewed'&&!decisions[idOf(p)])||(rf==='approved'&&s==='approved')||(rf==='maybe'&&s==='maybe')||(rf==='better'&&s==='better'))})}
function currentList(){const list=filteredPlayers();return list.slice(batchStart,batchStart+BATCH_SIZE)}
function renderBatch(){const list=filteredPlayers();if(batchStart>=list.length&&batchStart>0)batchStart=Math.max(0,Math.floor((list.length-1)/BATCH_SIZE)*BATCH_SIZE);const shown=list.slice(batchStart,batchStart+BATCH_SIZE);$('batchLabel').textContent=list.length?`Players ${batchStart+1}–${batchStart+shown.length} of ${list.length}`:'No players match';$('prev').disabled=batchStart===0;$('next').disabled=batchStart+BATCH_SIZE>=list.length;updateStats();$('app').innerHTML=shown.length?shown.map(playerSkeleton).join(''):'<div class="empty">No players match the current filters.</div>';for(const p of shown)loadPlayerCandidates(p)}
function playerSkeleton(p){const id=idOf(p),d=decisions[id]||{},s=d.state||'unreviewed';const man=manifest[id];let current='';if(man?.file||man?.source){const img=man?.file?`<img loading="lazy" src="${esc(man.file)}" alt="Current image for ${esc(p.name)}" onerror="this.style.display='none'">`:'';current=`<div class="current">${img}<div><div><strong>Existing manifest image</strong></div><div class="small">${esc(man.source||man.file||'Source not recorded')}</div></div></div>`}return `<section class="player" id="p-${esc(id)}"><div class="playerhead"><div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.category||'')} · rank ${esc(p.rank??'')} · ${esc(p.status||'')}</div></div><span class="state ${s==='approved'?'approved':s==='maybe'?'maybe':s==='better'?'better':''}">${esc(labelState(s))}</span></div>${current}<div class="grid" id="g-${esc(id)}"><div class="empty searching">Searching Wikimedia Commons…</div></div><div class="player-actions"><button onclick="markBetter('${esc(id)}')">Needs better image</button><button onclick="retry('${esc(id)}')">Search again</button></div></section>`}
function labelState(s){return ({unreviewed:'Not reviewed',approved:'Approved',maybe:'Maybe',better:'Needs better image'})[s]||'Not reviewed'}
async function loadPlayerCandidates(p,force=false){const id=idOf(p);let d=decisions[id]||{};const g=$('g-'+id);if(!g)return;if(!force&&Array.isArray(d.candidates)&&d.candidates.length){draw(p,d.candidates,g);return}try{if(d.candidates)delete d.candidates;drawLoading(g,'Searching Wikimedia Commons…');const cs=await commonsSearch(p.name);decisions[id]={...d,candidates:cs};save();draw(p,cs,g)}catch(e){g.innerHTML=`<div class="empty">Search failed: ${esc(e.message)}<br><button onclick="retry('${esc(id)}')">Retry</button></div>`}}
function drawLoading(g,text){g.innerHTML=`<div class="empty searching">${esc(text)}</div>`}
function cleanCandidate(x,p){const i=x.imageinfo?.[0];if(!i)return null;const mime=(i.mime||'').toLowerCase();if(!['image/jpeg','image/png','image/webp'].includes(mime))return null;if((i.width||0)<MIN_SIDE||(i.height||0)<MIN_SIDE)return null;const title=x.title||'';const meta=i.extmetadata||{};const artist=strip(meta.Artist?.value||meta.Credit?.value||'');const lic=strip(meta.LicenseShortName?.value||meta.License?.value||'');const desc=strip(meta.ImageDescription?.value||'');const hay=(title+' '+desc).toLowerCase();const name=p.name.toLowerCase();const parts=name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/\s+/).filter(x=>x.length>2);let score=0;if(hay.includes(name))score+=35;const ascii=name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,'').toLowerCase();if(ascii&&hay.includes(ascii))score+=20;score+=parts.filter(x=>hay.includes(x)).length*8;if(/basket|nba|game|match|court|dunk|shot|rebound|dribble|lakers|celtics|bulls|sixers|76ers|heat|spurs|warriors|thunder|nuggets|knicks|suns|rockets|pistons|jazz|bucks|nets|hawks|magic|cavaliers|cavaliers|raptors|timberwolves|blazers|grizzlies|kings|wizards|pacers|hornets|mavericks|clippers|pelicans/.test(hay))score+=10;if(/portrait|headshot|press photo/.test(hay))score-=4;const ar=(i.width||1)/(i.height||1);if(ar>0.45&&ar<1.35)score+=5;score+=Math.min(10,Math.log10(Math.max(i.width,i.height))*2);return{title,url:i.thumburl||i.url,original:i.url,width:i.width,height:i.height,mime,page:i.descriptionurl||`https://commons.wikimedia.org/wiki/${encodeURIComponent(title.replace(/ /g,'_'))}`,artist,license:lic||'Licence not stated in returned metadata',description:desc,score}}
async function commonsRequest(query){const u=new URL(API);const params={action:'query',generator:'search',gsrsearch:query,gsrnamespace:'6',gsrlimit:'10',prop:'imageinfo',iiprop:'url|size|mime|extmetadata',iiurlwidth:'700',format:'json',formatversion:'2',origin:'*'};for(const[k,v]of Object.entries(params))u.searchParams.set(k,v);for(let attempt=0;attempt<4;attempt++){const r=await fetch(u.toString());if(r.status===429||r.status===503){const wait=Math.min(30000,5000*Math.pow(2,attempt));await sleep(wait);continue}if(!r.ok)throw new Error(`Commons returned HTTP ${r.status}`);const j=await r.json();if(j.error)throw new Error(j.error.info||'Commons API error');return j.query?.pages||[]}throw new Error('Wikimedia remained rate-limited after several attempts')}
async function commonsSearch(name){const queries=[`${name} basketball`,`${name} NBA`];let all=[];for(let qi=0;qi<queries.length;qi++){if(qi>0)await sleep(REQUEST_DELAY);const pages=await commonsRequest(queries[qi]);all.push(...pages);const good=dedupe(all.map(x=>cleanCandidate(x,{name})).filter(Boolean));if(good.length>=MAX_RESULTS)break}return dedupe(all.map(x=>cleanCandidate(x,{name})).filter(Boolean)).sort((a,b)=>b.score-a.score).slice(0,MAX_RESULTS)}
function dedupe(cs){const seen=new Set();return cs.filter(x=>{const k=x.original||x.url;if(seen.has(k))return false;seen.add(k);return true})}
function cropFor(id,i){const d=decisions[id]||{};return d.crops?.[i]||{zoom:1,x:50,y:50}}
function cropTransform(c){return `translate(${(50-c.x)*(c.zoom-1)*2}%,${(50-c.y)*(c.zoom-1)*2}%) scale(${c.zoom})`}
function applyCropPreview(id,i){const d=decisions[id]||{};const c=cropFor(id,i);const editorImg=$('editimg-'+id+'-'+i);if(editorImg){editorImg.style.transform=cropTransform(c);editorImg.style.transformOrigin='center center'}const mainImg=$('mainimg-'+id+'-'+i);if(mainImg){mainImg.style.transform=cropTransform(c);mainImg.style.transformOrigin='center center'}}
function editorHtml(id,i,x,d){const c=cropFor(id,i);return `<div class="editor-preview"><img id="editimg-${esc(id)}-${i}" src="${esc(x.url)}" alt="Crop preview" style="transform:${cropTransform(c)};transform-origin:center center;"></div><div class="editor-controls"><label>Zoom <input class="crop-number" type="number" min="1" max="2.5" step="0.05" value="${c.zoom}" oninput="cropChange('${esc(id)}',${i},'zoom',this.value)"></label><label>Horizontal position <input class="crop-number" type="number" min="0" max="100" step="1" value="${c.x}" oninput="cropChange('${esc(id)}',${i},'x',this.value)"><span class="crop-help">0 = left · 50 = centre · 100 = right</span></label><label>Vertical position <input class="crop-number" type="number" min="0" max="100" step="1" value="${c.y}" oninput="cropChange('${esc(id)}',${i},'y',this.value)"><span class="crop-help">0 = top · 50 = centre · 100 = bottom</span></label></div><div class="editor-actions"><button onclick="resetCrop('${esc(id)}',${i})">Reset</button><button class="primary" onclick="saveCrop('${esc(id)}',${i})">Use this crop</button></div><div class="crop-note">The preview above and the selected image card use the same crop. 50 is centred. The original Wikimedia file is never changed; these settings are saved for the later image-building step.</div>`}
window.toggleEditor=(id,i)=>{const e=$('editor-'+id+'-'+i);if(e)e.hidden=!e.hidden};
window.cropChange=(id,i,key,val)=>{const d=decisions[id]||{};d.crops=d.crops||{};let n=Number(val);if(!Number.isFinite(n))return;if(key==='zoom')n=Math.max(1,Math.min(2.5,n));else n=Math.max(0,Math.min(100,n));d.crops[i]={...(d.crops[i]||{zoom:1,x:50,y:50}),[key]:n};decisions[id]=d;applyCropPreview(id,i)};
window.resetCrop=(id,i)=>{const d=decisions[id]||{};d.crops=d.crops||{};d.crops[i]={zoom:1,x:50,y:50};decisions[id]=d;const e=$('editor-'+id+'-'+i);if(e){e.outerHTML=`<div class="editor" id="editor-${id}-${i}">${editorHtml(id,i,(d.candidates||[])[i],d)}</div>`;applyCropPreview(id,i)}};
window.saveCrop=(id,i)=>{const d=decisions[id]||{};d.cropSaved=d.cropSaved||{};d.cropSaved[i]=true;decisions[id]=d;save();applyCropPreview(id,i);const e=$('editor-'+id+'-'+i);if(e)e.hidden=true};
function draw(p,cs,g){const d=decisions[idOf(p)]||{};if(!cs.length){g.innerHTML='<div class="empty">No technically suitable candidates found.</div>';return}g.innerHTML=cs.map((x,i)=>{const cd=d.candidateDecisions?.[x.original||x.url]||'';const selected=d.selected===i;const c=cropFor(idOf(p),i);const cropSaved=d.cropSaved?.[i];return `<article class="card ${cd}" data-index="${i}"><div class="photo"><img id="mainimg-${esc(idOf(p))}-${i}" loading="lazy" src="${esc(x.url)}" alt="${esc(p.name)}" style="transform:${cropTransform(c)};transform-origin:center center;" onerror="this.closest('.card').classList.add('reject');this.closest('.card').querySelector('.imgfail').hidden=false"><span class="badge imgfail" hidden>Image failed</span>${selected?'<span class="badge">Selected</span>':''}${cropSaved?'<span class="badge" style="top:7px;left:auto;right:7px">Cropped</span>':''}</div><div class="info"><div class="title">${esc(x.title.replace(/^File:/,''))}</div><div class="dims">${x.width} × ${x.height} · ${esc(x.mime)}</div><div class="lic">${esc(x.license)}${x.artist?`<br>${esc(x.artist)}`:''}</div><div class="actions"><button class="keepbtn" onclick="keep('${esc(idOf(p))}',${i})">KEEP</button><button class="maybebtn" onclick="maybe('${esc(idOf(p))}',${i})">MAYBE</button><button class="rejectbtn" onclick="reject('${esc(idOf(p))}',${i})">REJECT</button></div><button style="width:100%;margin-top:5px" onclick="toggleEditor('${esc(idOf(p))}',${i})">✂ Adjust crop</button><div class="editor" id="editor-${esc(idOf(p))}-${i}" hidden>${editorHtml(idOf(p),i,x,d)}</div><a class="openlink" href="${esc(x.page)}" target="_blank" rel="noopener"><button style="width:100%;margin-top:5px">OPEN COMMONS</button></a></div></article>`}).join('')}
function setCandidate(id,i,status){const d=decisions[id]||{};const cs=d.candidates||[];const c=cs[i];if(!c)return;const key=c.original||c.url;decisions[id]={...d,candidateDecisions:{...(d.candidateDecisions||{}),[key]:status},selected:status==='keep'?i:(d.selected===i?null:d.selected),state:status==='keep'?'approved':status==='maybe'?'maybe':(d.state==='approved'?'approved':d.state||'unreviewed')};save();rerenderOne(id)}
function rerenderOne(id){const p=players.find(x=>idOf(x)===id),g=$('g-'+id);if(p&&g){draw(p,decisions[id]?.candidates||[],g);const sec=$('p-'+id);const st=sec?.querySelector('.state');if(st){const s=stateFor(p);st.textContent=labelState(s);st.className='state '+(s==='approved'?'approved':s==='maybe'?'maybe':s==='better'?'better':'')}}}
window.keep=(id,i)=>setCandidate(id,i,'keep');window.maybe=(id,i)=>setCandidate(id,i,'maybe');window.reject=(id,i)=>setCandidate(id,i,'reject');
window.markBetter=id=>{decisions[id]={...(decisions[id]||{}),state:'better',selected:null};save();rerenderOne(id)};
window.retry=async id=>{const p=players.find(x=>idOf(x)===id);if(!p)return;const d=decisions[id]||{};delete d.candidates;delete d.selected;decisions[id]=d;save();await loadPlayerCandidates(p,true)};
$('prev').onclick=()=>{batchStart=Math.max(0,batchStart-BATCH_SIZE);renderBatch();window.scrollTo(0,0)};$('next').onclick=()=>{batchStart+=BATCH_SIZE;renderBatch();window.scrollTo(0,0)};
$('refresh').onclick=()=>loadData();
['reviewFilter','category'].forEach(id=>$(id).onchange=()=>{batchStart=0;renderBatch()});
$('search').oninput=()=>{batchStart=0;renderBatch()};
$('clear').onclick=()=>{if(confirm('Clear all image-review decisions on this device?')){decisions={};localStorage.removeItem(STORAGE);renderBatch();updateStats()}};
$('export').onclick=()=>{const out={version:2,generated:new Date().toISOString(),players:{}};for(const p of players){const d=decisions[idOf(p)];if(d)out.players[idOf(p)]={id:idOf(p),name:p.name,state:d.state||'unreviewed',selected:d.selected??null,candidates:d.candidates||[],candidateDecisions:d.candidateDecisions||{},crops:d.crops||{},cropSaved:d.cropSaved||{}}}download('image-approvals.json',JSON.stringify(out,null,2),'application/json')};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const j=JSON.parse(await f.text());const incoming=j.players||{};let count=0;for(const [id,d] of Object.entries(incoming)){if(players.some(p=>idOf(p)===id)){decisions[id]=d;count++}}save();renderBatch();alert(`Imported ${count} player review records.`)}catch(err){alert('Could not import approvals: '+err.message)}e.target.value=''};
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('help').onclick=()=>alert('Review goal: choose images where a child can immediately recognise the player.\n\nKEEP selects that image and approves the player. MAYBE saves it for comparison. REJECT removes it from consideration. “Needs better image” flags the player for another search later.\n\nDecisions are stored on this device. Export approvals before changing device/browser.');
loadData();
</script>
</body></html>
