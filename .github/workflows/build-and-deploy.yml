name: Build and Deploy Ari NBA Cards

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        run: |
          echo "Working directory:"
          pwd
          echo "Repository files:"
          find . -maxdepth 2 -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image tools
        run: pip install Pillow

      - name: Fetch approved images
        run: |
          if [ -f "image-manifest.json" ]; then
            echo "Image manifest found."
            python fetch_images.py || echo "::warning::Image acquisition failed; continuing without downloaded images."
          else
            echo "::warning::image-manifest.json not found; skipping image acquisition."
          fi

      - name: Validate player data
        run: |
          if [ -f "validate.py" ]; then
            python validate.py
          else
            echo "::warning::validate.py not found."
          fi

      - name: Validate images
        run: |
          if [ -f "validate_images.py" ]; then
            python validate_images.py || echo "::warning::Some images are missing or invalid; continuing."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
